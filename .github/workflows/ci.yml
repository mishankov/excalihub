name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and Svelte components
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Run HTTP integration test
        run: npm run test:integration

  docker:
    name: Build Docker image
    needs: test
    if: github.ref != 'refs/heads/master' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: excalihub:ci
          cache-from: type=gha,scope=excalihub
          cache-to: type=gha,mode=max,scope=excalihub

  publish:
    name: Publish Docker image
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref_type == 'tag'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
