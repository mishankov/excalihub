services:
  excalihub:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_PATH: /app/data/excalihub.sqlite
    volumes:
      - diagrams:/app/data
    restart: unless-stopped
volumes:
  diagrams:
